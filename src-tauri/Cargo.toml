[package]
name = "app"
version = "2.2.0"
description = "EEditor — a notes editor built on the EELisp engine"
authors = ["Roberto Santacroce Martins <roberto@santacroce.xyz>"]
license = "MIT"
repository = "https://github.com/santacroce-tech/eeditor-next"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Decodes the percent-encoded headers `fs_save_asset` takes (an image's folder and name).
percent-encoding = "2"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Local plugin: native iOS folder picker (external folder as workspace) with security-scoped bookmarks.
tauri-plugin-ios-files = { path = "plugins" }
# The Rust EELisp engine — the reusable core. EngineHandle is Send+Sync for Tauri state.
eelisp = { path = "../../eelisp-rs" }

# The engine is an interpreter: unoptimised, a program runs ~15× slower (a ZX Spectrum frame
# written in EELisp takes 330 ms instead of 21). Optimise it even in `tauri dev`; the app's own
# crate stays quick to rebuild.
[profile.dev.package.eelisp]
opt-level = 3
