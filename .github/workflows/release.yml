name: Release

# Push a tag to cut a release:  git tag -a v2.3.0 -m "…" && git push origin v2.3.0
# The release is created as a DRAFT — check the installers, then publish it by hand. Publishing is
# what moves the website's download links: they point at releases/latest/download/EEditor-*, the
# fixed-name copies the `finalize` job attaches, and "latest" is the newest *published* release.
#
# A rehearsal, with no release touched:  Actions → Release → Run workflow → dry run ✓
# (or `gh workflow run release.yml -f dry-run=true --ref <branch>`). It builds every platform from
# that branch and leaves the installers as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the installers to (e.g. v2.3.0). Not needed for a dry run."
        required: false
        default: ""
      dry-run:
        description: "Dry run: build every platform from the selected branch; attach nothing"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails in seconds, before twenty minutes of building, if the version the tag names isn't the one
  # every manifest carries — the installers are named from tauri.conf.json, the tag from you.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      ref: ${{ steps.what.outputs.ref }}
      dry: ${{ steps.what.outputs.dry }}
    steps:
      - id: what
        env:
          DRY: ${{ github.event.inputs.dry-run == 'true' }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$DRY" = true ]; then
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          else
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            case "$tag" in v*) ;; *) echo "::error::'$tag' is not a v* tag — pass one, or tick dry run"; exit 1 ;; esac
            echo "dry=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.ref }}
      - name: One version everywhere
        env:
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const read = (f) => fs.readFileSync(f, "utf8");
          const lock = JSON.parse(read("package-lock.json"));
          const found = {
            "package.json": JSON.parse(read("package.json")).version,
            "package-lock.json": lock.version,
            'package-lock.json packages[""]': lock.packages?.[""]?.version,
            "src-tauri/Cargo.toml": /^version\s*=\s*"([^"]+)"/m.exec(read("src-tauri/Cargo.toml"))?.[1],
            "src-tauri/tauri.conf.json": JSON.parse(read("src-tauri/tauri.conf.json")).version,
          };
          const tag = process.env.TAG;
          if (tag) found[`the tag ${tag}`] = tag.replace(/^v/, "");
          for (const [where, v] of Object.entries(found)) console.log(`${String(v).padEnd(10)} ${where}`);
          if (new Set(Object.values(found)).size !== 1) {
            console.log("::error::The versions disagree. Bump them together (npm version --no-git-tag-version, then Cargo.toml and tauri.conf.json), or tag the version they carry.");
            process.exit(1);
          }
          EOF

  # What "Export as HTML…" writes a form into: the runtime page and the WebAssembly engine in one file.
  # The same on every platform, so it is built once, here, and handed to each desktop build.
  runtime:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: eeditor-next
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/checkout@v4
        with:
          repository: santacroce-tech/eelisp-rs
          path: eelisp-rs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eeditor-next/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - name: Install app dependencies
        working-directory: eeditor-next
        run: npm ci
      - name: The WebAssembly engine and the runtime template
        working-directory: eeditor-next
        run: |
          npm run engine:wasm
          npm run runtime:template
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-template
          path: eeditor-next/public/runtime/

  build:
    needs: [preflight, runtime]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One disk image for both Intel and Apple Silicon.
          - platform: macos-latest
            name: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          # 22.04, not latest: an AppImage built against a newer glibc won't start on older distros.
          - platform: ubuntu-22.04
            name: linux
            rust-targets: ""
            args: --bundles deb,appimage
          - platform: windows-latest
            name: windows
            rust-targets: ""
            args: --bundles msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: eeditor-next
          ref: ${{ needs.preflight.outputs.ref }}
      # The Tauri crate depends on the engine by path (`../../eelisp-rs`).
      - uses: actions/checkout@v4
        with:
          repository: santacroce-tech/eelisp-rs
          path: eelisp-rs

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eeditor-next/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eeditor-next/src-tauri

      - name: System dependencies (webkit2gtk for Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libxdo-dev build-essential

      - name: Install app dependencies
        working-directory: eeditor-next
        run: npm ci

      # public/ is copied into the app's frontend, so the template ships inside every installer.
      - uses: actions/download-artifact@v4
        with:
          name: runtime-template
          path: eeditor-next/public/runtime/

      # With no tagName (a dry run) tauri-action only builds; with one it creates the draft and
      # uploads to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: eeditor-next
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: EEditor __VERSION__
          releaseBody: |
            Desktop builds of EEditor __VERSION__.

            | Platform | File |
            |---|---|
            | macOS (Intel + Apple Silicon) | `.dmg` |
            | Windows 10/11 (x64) | `.msi` or `-setup.exe` |
            | Linux (x64) | `.AppImage` or `.deb` |

            `EEditor-*` are the same installers under names that don't change between versions —
            what the website links to. `SHA256SUMS.txt` has the checksums of every file.

            The macOS build is ad-hoc signed: on first launch, right-click the app and
            choose **Open** (or allow it under System Settings → Privacy & Security).
            The Windows installer is unsigned, so SmartScreen will ask once —
            **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the installers (dry run)
        if: needs.preflight.outputs.dry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            eeditor-next/src-tauri/target/**/release/bundle/dmg/*.dmg
            eeditor-next/src-tauri/target/**/release/bundle/nsis/*.exe
            eeditor-next/src-tauri/target/**/release/bundle/msi/*.msi
            eeditor-next/src-tauri/target/**/release/bundle/appimage/*.AppImage
            eeditor-next/src-tauri/target/**/release/bundle/deb/*.deb

  # Every platform arrived, or the run is red. Then the fixed-name copies the website links to,
  # and one checksum file for all of it.
  finalize:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: The release's installers
        if: needs.preflight.outputs.dry != 'true'
        run: gh release download "$TAG" --dir dist --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' --pattern '*.deb'
      - name: The dry run's installers
        if: needs.preflight.outputs.dry == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Check every platform, add the fixed names and checksums
        run: |
          set -euo pipefail
          mkdir -p out
          # Files are nested when they come from artifacts; flatten them.
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) \
            ! -name 'EEditor-*' -exec cp {} out/ \;
          cd out
          ls -l
          missing=0
          stable() { # <glob> <fixed name>
            local hits=( $1 )
            if [ ! -e "${hits[0]}" ]; then echo "::error::no $1 — that platform's build didn't produce it"; missing=1; return; fi
            if [ "${#hits[@]}" -ne 1 ]; then echo "::error::more than one $1: ${hits[*]}"; missing=1; return; fi
            cp "${hits[0]}" "$2"
            echo "| $2 | ${hits[0]} | $(du -h "${hits[0]}" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "| Fixed name | Installer | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          stable '*_universal.dmg'  EEditor-macOS.dmg
          stable '*_x64-setup.exe'  EEditor-Windows-setup.exe
          stable '*_x64_en-US.msi'  EEditor-Windows.msi
          stable '*_amd64.AppImage' EEditor-Linux.AppImage
          stable '*_amd64.deb'      EEditor-Linux.deb
          [ "$missing" = 0 ] || exit 1
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach them to the release
        if: needs.preflight.outputs.dry != 'true'
        run: gh release upload "$TAG" out/EEditor-* out/SHA256SUMS.txt --clobber

      - name: Keep them (dry run)
        if: needs.preflight.outputs.dry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            out/EEditor-*
            out/SHA256SUMS.txt
